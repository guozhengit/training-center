# ============================================================
# 生产环境 override: 数据卷改用 bind mount (宿主机目录)
#
# 用法:
#   docker compose \
#     -f docker-compose.yml \
#     -f deploy/linux/docker-compose.prod.yml \
#     up -d
#
# 数据目录默认 /home/docker/training-data,
# 可用环境变量 TRAINING_DATA_DIR 覆盖。
# 使用 backup.sh 停写后备份，避免 SQLite/WAL 与沙箱不一致。
# ============================================================
services:
  training-center:
    environment:
      # 浏览器同域 POST 也会带 Origin 头, 且经反代后 scheme 与容器内不一致,
      # 会被 Spring 判为跨域; 不放行真实访问来源则所有写操作返回 403。
      TRAINING_CORS_ALLOWED_ORIGINS: ${TRAINING_CORS_ALLOWED_ORIGINS:-https://train.sageflow.online,http://120.48.23.3:9091}
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 160s
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8080/actuator/health/readiness"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${TRAINING_DATA_DIR:-/home/docker/training-data}/training-runtime:/workspace/output/training-runtime

volumes:
  # 基础 compose 声明了命名卷, 生产环境改用 bind mount, 保留空声明避免 schema 警告
  training-runtime: {}
