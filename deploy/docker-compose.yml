services:
  training-center:
    build:
      # 工作区根目录 (jiupai, 需包含 output/coding-ai-exam + output/interview)
      # compose 位于 deploy/, 上两级即工作区根目录
      context: ../..
      dockerfile: training-center/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-training-center-base:17}
        VCS_REF: ${VCS_REF:-unknown}
    image: ${TRAINING_IMAGE:-training-center:latest}
    container_name: training-center
    init: true
    ports:
      - "${TRAINING_BIND_ADDRESS:-0.0.0.0}:${TRAINING_PORT:-8080}:8080"
    environment:
      - TZ=Asia/Shanghai
      - TRAINING_WORKSPACE=/workspace
      - TRAINING_JDK_HOME=/opt/java/openjdk
      - TRAINING_MAVEN_HOME=/opt/maven
      - TRAINING_PYTHON=python3
      - SERVER_PORT=8080
      # Optional lightweight API auth. When set, /api/** requires X-API-Key.
      - TRAINING_API_KEY=${TRAINING_API_KEY:-}
      # JVM tuning for containers
      - JAVA_OPTS=${JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseContainerSupport -Duser.timezone=Asia/Shanghai}
    volumes:
      # Mutable runtime data (database, sandboxes, exports, logs)
      - training-runtime:/workspace/output/training-runtime
    restart: unless-stopped
    stop_grace_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Resource limits (adjust to your server)
    deploy:
      resources:
        limits:
          memory: ${TRAINING_MEMORY_LIMIT:-2G}
          cpus: "${TRAINING_CPU_LIMIT:-2.0}"
        reservations:
          memory: 512M
          cpus: "0.5"

volumes:
  training-runtime:
    driver: local
