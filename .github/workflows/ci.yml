name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  deployment:
    name: Deployment Scripts & Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for script in deploy/linux/*.sh deploy/base/*.sh; do
            bash -n "$script"
          done
      - name: Test deployment lifecycle and Compose configuration
        run: python3 -m unittest discover -s deploy/linux/tests -v

  backend:
    name: Java Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test all modules
        run: mvn -B clean verify -Pverify -DexcludedGroups=integration

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          retention-days: 7

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: training-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --silent

      - name: Run unit tests
        run: npm run test:run

      - name: Build
        run: npx vite build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-ui-dist
          path: training-ui/dist/
          retention-days: 14
