server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: training-center
    version: 1.0.0-SNAPSHOT

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.guoyongzheng.training: INFO

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

spring:
  data:
    redis:
      host: ${TRAINING_REDIS_HOST:localhost}
      port: ${TRAINING_REDIS_PORT:6379}
      password: ${TRAINING_REDIS_PASSWORD:}

training:
  workspace: ${TRAINING_WORKSPACE:}
  jdk-home: ${TRAINING_JDK_HOME:D:/jdk/jdk-17.0.12}
  maven-home: ${TRAINING_MAVEN_HOME:D:/Program Files (x86)/apache-maven-3.9.9}
  python-executable: ${TRAINING_PYTHON:python}
  sandbox-retention-hours: ${TRAINING_SANDBOX_RETENTION_HOURS:72}
  api-key: ${TRAINING_API_KEY:}
  database-type: ${TRAINING_DATABASE_TYPE:sqlite}
  database-url: ${TRAINING_DB_URL:jdbc:postgresql://localhost:5432/training}
  database-user: ${TRAINING_DB_USER:postgres}
  database-password: ${TRAINING_DB_PASSWORD:}
  redis-host: ${TRAINING_REDIS_HOST:}
  redis-port: ${TRAINING_REDIS_PORT:6379}
  redis-password: ${TRAINING_REDIS_PASSWORD:}
